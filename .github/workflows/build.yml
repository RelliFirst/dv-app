name: Build DriveVoice APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Write project files
        run: |
          set -e
          mkdir -p "."
          echo '' | base64 -d > 'settings.gradle'
          mkdir -p "."
          echo 'cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguNS4yJyBhcHBseSBmYWxzZQp9Cg==' | base64 -d > 'build.gradle'
          mkdir -p "."
          echo 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bQphbmRyb2lkLnVzZUFuZHJvaWRYPXRydWUKYW5kcm9pZC5ub25UcmFuc2l0aXZlUkNsYXNzPXRydWUK' | base64 -d > 'gradle.properties'
          mkdir -p "app"
          echo '' | base64 -d > 'app/build.gradle'
          mkdir -p "app/src/main"
          echo '' | base64 -d > 'app/src/main/AndroidManifest.xml'
          mkdir -p "app/src/main/java/com/benzion/drivevoice"
          echo '' | base64 -d > 'app/src/main/java/com/benzion/drivevoice/Config.java'
          mkdir -p "app/src/main/java/com/benzion/drivevoice"
          echo '' | base64 -d > 'app/src/main/java/com/benzion/drivevoice/Prefs.java'
          mkdir -p "app/src/main/java/com/benzion/drivevoice"
          echo '' | base64 -d > 'app/src/main/java/com/benzion/drivevoice/MainActivity.java'
          mkdir -p "app/src/main/java/com/benzion/drivevoice"
          echo '' | base64 -d > 'app/src/main/java/com/benzion/drivevoice/SettingsActivity.java'
          mkdir -p "app/src/main/java/com/benzion/drivevoice"
          echo '' | base64 -d > 'app/src/main/java/com/benzion/drivevoice/NotifListener.java'
          mkdir -p "app/src/main/java/com/benzion/drivevoice"
          echo '' | base64 -d > 'app/src/main/java/com/benzion/drivevoice/VoiceService.java'
          mkdir -p "app/src/main/res/values"
          echo '' | base64 -d > 'app/src/main/res/values/strings.xml'
          mkdir -p "app/src/main/res/values"
          echo '' | base64 -d > 'app/src/main/res/values/styles.xml'
          mkdir -p "app/src/main/res/layout"
          echo '' | base64 -d > 'app/src/main/res/layout/activity_main.xml'
          mkdir -p "app/src/main/res/layout"
          echo '' | base64 -d > 'app/src/main/res/layout/activity_settings.xml'
          mkdir -p "app/src/main/res/drawable"
          echo '' | base64 -d > 'app/src/main/res/drawable/round_btn.xml'
          mkdir -p "app/src/main/res/drawable"
          echo '' | base64 -d > 'app/src/main/res/drawable/ic_launcher_background.xml'
          mkdir -p "app/src/main/res/drawable"
          echo '' | base64 -d > 'app/src/main/res/drawable/ic_launcher_foreground.xml'
          mkdir -p "app/src/main/res/mipmap-anydpi-v26"
          echo '' | base64 -d > 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml'
          mkdir -p "config"
          echo '' | base64 -d > 'config/commands.json'
          echo '' | base64 -d > release.keystore

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASS: drivevoice123
          KEY_ALIAS: drivevoice
          KEY_PASS: drivevoice123
        run: |
          gradle assembleRelease -PCONFIG_REPO=${{ github.repository }} --no-daemon

      - name: Verify signature and alignment
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          echo "== apksigner verify =="
          "$BT/apksigner" verify --print-certs "$APK"
          echo "== zipalign check =="
          "$BT/zipalign" -c -v 4 "$APK" | tail -2

      - name: Publish to output/updates.apk and commit
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/updates.apk
          VC=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle | head -1)
          VN=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          printf '{\n  "versionCode": %s,\n  "versionName": "%s"\n}\n' "$VC" "$VN" > output/version.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/updates.apk output/version.json config/commands.json || true
          git commit -m "Build APK (versionCode $VC)" || echo "nothing to commit"
          git push || echo "push skipped"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriveVoice-apk
          path: app/build/outputs/apk/release/app-release.apk
